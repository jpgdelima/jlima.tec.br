<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090a;--line:#1d2428;--ink:#e9eef0;--muted:#97a3a8;--accent:#1fa971;--accent-dim:#13603f;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse 60% 60% at 50% 110%,rgba(31,169,113,.16),transparent 70%),var(--bg);color:var(--ink);font:400 16.5px/1.6 "IBM Plex Sans",system-ui,sans-serif;padding:32px;text-align:center}
.code{font:500 13px "IBM Plex Mono",monospace;letter-spacing:3px;color:var(--accent)}
h1{font:700 clamp(30px,5vw,48px)/1.15 "Sora",system-ui,sans-serif;margin:14px 0 12px}
p{color:var(--muted);max-width:46ch;margin:0 auto}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
a{font-weight:600;font-size:14.5px;text-decoration:none;padding:10px 17px;border-radius:8px;border:1px solid var(--line);color:var(--ink)}
a.p{background:var(--accent);border-color:var(--accent);color:#03140c}
a:hover{border-color:var(--accent-dim)}
.mono{display:inline-grid;place-items:center;width:46px;height:46px;border:1px solid var(--accent-dim);border-radius:10px;color:var(--accent);font:600 16px "Sora",sans-serif;margin-bottom:26px}
</style>
</head>
<body>
<main>
  <div class="mono">JL</div>
  <div class="code">ERRO 404</div>
  <h1>Esta página não existe.</h1>
  <p>O endereço pode ter mudado ou sido digitado errado. Volte ao início ou veja os perfis de atuação.</p>
  <div class="row"><a class="p" href="/">Voltar ao site</a><a href="/cv/cto/">Ver perfis</a><a href="https://cal.com/jpgdelima">Agendar conversa</a></div>
</main>
</body>
</html>
